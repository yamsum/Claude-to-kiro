# Source: https://github.com/<owner>/<repo> — <SkillName> hook
# Version: 1.0.0
name: skill-name-hook
# name must be unique across all hooks in .kiro/hooks/

description: One sentence: when this fires and what it does.

on:
  # Choose one or more:
  # - fileChanged       fires when watched files are saved
  # - agentHookStart    fires before the agent starts a task
  # - agentHookStop     fires after the agent finishes a task
  # - agentTurnStart    fires at the start of each conversation turn
  - fileChanged

trigger:
  # Optional: shell command to run before the agent instructions.
  # If the command fails, the hook still runs; failure is reported to the agent.
  command: echo "replace with your command"

  # Required when on: fileChanged — glob patterns for files that must
  # have changed to trigger this hook.
  paths:
    - "**/*.ts"
    - "**/*.html"
    - "**/*.scss"

instructions: |
  Concise instructions for what the agent should do when this hook fires.
  Keep this under 10 lines. For complex workflows, reference the corresponding
  steering document by path: "Follow the workflow in .kiro/steering/skill-name.md"

  Example: "The knowledge graph has been updated. Read graphify-out/GRAPH_REPORT.md
  before answering any questions about codebase structure."
